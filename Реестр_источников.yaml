      sha256: 35CD89F1F5FDEB49B7233A7870C147DAA02376805DCA34FA5838ABE8B2050636
      archive_entries: 835
      structural_check: directory_read_only
    intended_use:
      - "Исследование ToolNode, interrupt, checkpoint/state и Human-in-the-Loop."
      - "Минимальный адаптер к общему PolicyGateway после выбора Python или JavaScript/TypeScript."
    restrictions:
      - "Не считать LangGraph песочницей или движком политик безопасности."
      - "Перед копированием фрагмента зафиксировать точный commit, исходный путь, изменения и тест."
      - "ZIP содержит Python core и JS CLI-примеры, но не полное дерево LangGraph.js; для JS/TS нужен отдельный upstream artifact."
    inspected_paths:
      - LICENSE
      - libs/prebuilt/langgraph/prebuilt/tool_node.py
      - libs/langgraph/langgraph/types.py
    adaptations:
      - artifact: policy-gateway/langgraph_adapter/adapter.py
        kind: original_code_based_on_tool_call_contract
        sources:
          - libs/prebuilt/langgraph/prebuilt/tool_node.py
          - https://docs.langchain.com/oss/python/langgraph/interrupts
          - https://docs.langchain.com/oss/python/langgraph/persistence
        changes: "Преобразование id/name/args в общий tool.requested; доверенное enrollment; fail-closed guarded_execute; approval binding и replay prevention. Код LangGraph не копировался."
        tests: policy-gateway/test_langgraph_adapter.py
        limitation: "Восемь тестов проверяют собственный контракт отдельно от runtime."
      - artifact: policy-gateway/langgraph_adapter/runtime.py
        kind: original_integration_code_using_public_api
        sources:
          - https://pypi.org/project/langgraph/1.2.12/
          - https://docs.langchain.com/oss/python/langgraph/interrupts
          - https://docs.langchain.com/oss/python/langgraph/persistence
          - https://reference.langchain.com/python/langgraph/prebuilt/tool_node/ToolNode
        dependency: "langgraph==1.2.12, установлен с PyPI в отдельное runtime/langgraph-py"
        changes: "Собственный граф policy -> ToolNode/END и policy -> interrupt -> ToolNode/END; доверенный thread enrollment; строгий формат ответа человека. Исходный код LangGraph не копировался."
        tests: policy-gateway/test_langgraph_runtime.py
        limitation: "Шесть runtime-тестов используют InMemorySaver и безвредные функции без файловых/сетевых эффектов; LLM, долговечное состояние и изоляция ОС не проверены. Хеш wheel пока не зафиксирован."

