  - id: openai-agents-python-tool-guardrails
    role: l3-tool-guardrail-reference
    upstream:
      repository: https://github.com/openai/openai-agents-python
      ref: main
      acquisition: "ZIP предоставлен пользователем"
      commit: null # Точный commit из предоставленного архива не установлен.
      license: MIT
    artifact:
      filename: openai-agents-python-main.zip
      sha256: 0AFB8D6B6A1275613248A5508A18CC8A7082310900D596F9024DA4A3BD0655FE
      structural_check: "просмотр исходников и тестов без установки/запуска SDK"
    inspected_paths:
      - LICENSE
      - src/agents/tool_guardrails.py
      - src/agents/run_internal/tool_execution.py
      - tests/test_tool_guardrails.py
    decision:
      kind: reference_only_no_code_copy
      reason: "ToolInputGuardrail/ToolOutputGuardrail привязаны к Agent, ToolContext, Runner и FunctionTool этого SDK. Input guardrail подтверждает точку до function tool; output guardrail выполняется после тела и не отменяет внешний эффект. reject_content/raise_exception полезны для сопоставления, но не заменяют общий allow/deny/require_review шлюз."
      future_adapter: "Если команда выберет OpenAI Agents SDK, сопоставить input allow/reject/raise с PolicyGateway перед FunctionTool. Shell/computer/custom tools требуют отдельных точек, потому что просмотренный путь guardrails относится к function tools."
    restrictions:
      - "SDK не установлен и тесты upstream не запускались."
      - "Output guardrail нельзя считать предотвращением уже совершённого эффекта."
      - "Код не переносился, поэтому MIT-файл не добавлялся в third_party."

